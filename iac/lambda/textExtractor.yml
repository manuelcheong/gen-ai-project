textExtractorFunction:
  Type: AWS::Lambda::Function
  Properties:
    Code:
      ZipFile: |
        def lambda_handler(event, context):
          blocks = event.get('blocks', [])
    
          # Extract text from LINE blocks
          extracted_text = ""
          for block in blocks:
              if block.get('BlockType') == 'LINE':
                  extracted_text += block.get('Text', '') + "\n"
          
          # If this is the first page, initialize the pages array
          if 'extractedPages' not in event:
              event['extractedPages'] = []
          
          # Add this page's text to the array
          event['extractedPages'].append(extracted_text)
          
          return event

    Description: AWS Lambda function to Extract content from a document
    FunctionName: TextExtractorFunction
    Handler: index.lambda_handler
    MemorySize: 256
    Role: arn:aws:iam::178934116267:role/AlseaLambdaFullAccess
    Runtime: python3.13
    Architectures:
      - arm64
    Timeout: 60
