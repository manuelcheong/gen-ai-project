combineTextFunction:
  Type: AWS::Lambda::Function
  Properties:
    Code:
      ZipFile: |
        def lambda_handler(event, context):
          extracted_pages = event.get('extractedPages', [])
    
          # Combine all pages into a single text
          full_text = "\n\n".join(extracted_pages)
          
          return {
              "fullText": full_text
          }

    Description: AWS Lambda function to Extract content from a document
    FunctionName: CombineTextFunction
    Handler: index.lambda_handler
    MemorySize: 256
    Role: arn:aws:iam::178934116267:role/AlseaLambdaFullAccess
    Runtime: python3.13
    Architectures:
      - arm64
    Timeout: 60
