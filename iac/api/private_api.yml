privaterestApiRole:
  Type: 'AWS::IAM::Role'
  Properties:
    AssumeRolePolicyDocument:
      Version: '2012-10-17'
      Statement:
        - Action:
            - 'sts:AssumeRole'
          Effect: Allow
          Principal:
            Service:
              - apigateway.amazonaws.com
    Policies:
      - PolicyName: gen-ai-restapi-private-role-Policy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - logs:*
              Resource: "*"

            - Effect: Allow
              Action:
                - dynamodb:*
              Resource: "*"

              #Condition:
              #  StringEquals:
              #    'aws:SourceVpce': !Ref ApiGatewayVpcEndpoint


