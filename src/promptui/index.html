<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MenuGen 0.1</title>
    <script src="config.js"></script>
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', (event) => {
            const socketUrl = window.config.websocketUrl;
            const token = 'eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJub2xpMjMiLCJpYXQiOjE3NDA4OTQwNjMsImV4cCI6MTc0MDk4MDQ2M30.tuxcTREygeIqcAOJfoQVAPX4TEFFC9YplAYXID5GlwM'; // Replace with your actual token

            const socket = new WebSocket(socketUrl, [], {
                headers: {
                    Authorization: `${token}`
                }
            });

            socket.onopen = () => {
                console.log('WebSocket connection established');
            };

            socket.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                console.log('WebSocket event received:');
                console.log(event);
                console.log('WebSocket message received:');
                console.log(msg);  
                 
                if (msg.Message?.Body?.content) {
                    const content = msg.Message.Body.content[0].text;
                    const iframe = document.getElementById('responseFrame');
                    iframe.contentWindow.document.open();
                    iframe.contentWindow.document.write(content);
                    iframe.contentWindow.document.close();
                }
            };

            socket.onerror = (error) => {
                console.error('WebSocket error:', error);
            };

            socket.onclose = () => {
                console.log('WebSocket connection closed');
            };

            const form = document.getElementById('promptForm');
            const input = document.getElementById('promptInput');

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                if (input.value) {
                    const content = '<p>Generando contenido ...</p>';
                    const iframe = document.getElementById('responseFrame');
                    iframe.contentWindow.document.open();
                    iframe.contentWindow.document.write(content);
                    iframe.contentWindow.document.close();


                    socket.send(JSON.stringify({
                                                    "index": "gen-prompt-menu",
                                                    "body": {
                                                        "prompt": input.value
                                                        
                                                    }
                                                } ));
                    input.value = '';
                }
            });

            // ---- MENU -----
            const form2 = document.getElementById('promptForm2');
            const input2 = document.getElementById('promptInput2');

            form2.addEventListener('submit', (e) => {
                e.preventDefault();
                if (input2.value) {
                    socket.send(JSON.stringify({
                                                    "index": "gen-prompt-menu",
                                                    "body": {
                                                        "menu": input2.value
                                                        
                                                    }
                                                } ));
                    input2.value = '';
                }
            });
        });
    </script>
</head>
<body>
    <h1> Pedido </h1>
    <ul id="messages"></ul>
    <form id="promptForm" action="">
        <input id="promptInput" autocomplete="off" /><button type="submit">Send</button>
    </form>

    <iframe id="responseFrame" style="width: 100%; height: 600px;"></iframe>

    <h1> Menu </h1>
    <ul id="messages2"></ul>
    <form id="promptForm2" action="">
        <input id="promptInput2" autocomplete="off" /><button type="submit">Send</button>
    </form>

</body>
</html>
