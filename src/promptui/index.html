<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket WebApp</title>
    <script src="config.js"></script>
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', (event) => {
            const socketUrl = window.config.websocketUrl;
            const token = 'eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJub2xpMjMiLCJpYXQiOjE3NDA4OTQwNjMsImV4cCI6MTc0MDk4MDQ2M30.tuxcTREygeIqcAOJfoQVAPX4TEFFC9YplAYXID5GlwM'; // Replace with your actual token

            const socket = new WebSocket(socketUrl, [], {
                headers: {
                    Authorization: `${token}`
                }
            });

            socket.onopen = () => {
                console.log('WebSocket connection established');
            };

            socket.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                if (msg.type === 'response') {
                    const item = document.createElement('li');
                    item.textContent = msg.data;
                    document.getElementById('messages').appendChild(item);
                    window.scrollTo(0, document.body.scrollHeight);
                }
            };

            socket.onerror = (error) => {
                console.error('WebSocket error:', error);
            };

            socket.onclose = () => {
                console.log('WebSocket connection closed');
            };

            const form = document.getElementById('promptForm');
            const input = document.getElementById('promptInput');

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                if (input.value) {
                    socket.send(JSON.stringify({ type: 'prompt', data: input.value }));
                    input.value = '';
                }
            });
        });
    </script>
</head>
<body>
    <ul id="messages"></ul>
    <form id="promptForm" action="">
        <input id="promptInput" autocomplete="off" /><button>Send</button>
    </form>
</body>
</html>
