service: gen-ai-service
frameworkVersion: '4'

package:
  individually: true
  exclude:
    - "./*"
    - "src/*"
    - "node_modules/*"
    - "target/**"


provider:
  name: aws
  runtime: nodejs22.x
  stage: ${opt:stage, 'pre'}
  timeout: 28
  region: ${opt:region, "eu-west-1"}
  memorySize: 512
  logRetentionInDays: 90
  apiGateway: 
    request:
      schemas:
        readyForPickupModel:
          schema: ${file(./iac/api/schemas/schema-messages.json)}
          name: messagesModel
          description: 'Schema for MessageModel'
  environment:
    STAGE: ${self:provider.stage}
    REGION: ${self:provider.region}
    SERVICE: ${self:service}
    AWS_NODEJS_CONNECTION_REUSE_ENABLED: 1
    GLOBAL_TIMEOUT: 15000
    KEY_SSM: /aws/ssm/parameter/genaiapikey
    #KEY_SSM2: ${ssm:/parameter/genaiapikey}
  lambdaHashingVersion: 20201221
  architecture: arm64
  

  iamRoleStatements:
  - Effect: Allow
    Action:
      - states:*
    Resource: "*"
  
  - Effect: Allow
    Action:
      - lambda:*
    Resource: "*"

  - Effect: "Allow"
    Action:
      - "secretsmanager:*"
    Resource: "*"

  - Effect: "Allow"
    Action:
      - "ssm:*"
    Resource: "*"

  - Effect: "Allow"
    Action:
      - "s3:*"
    Resource: "*"

#functions:
#  scrapperrs: '${file(./iac/lambda/scrapper.yml):scrapperrs}'
  #enrich_event: '${file(./iac/lambda/enrich_event.yml):enrich_event}'
  #faiss: '${file(./iac/lambda/faiss.yml):faiss}'
functions:
  strands: '${file(./iac/lambda/agent.yml):strands}'
    
  

resources:
  # ---------- PArameters 🫡 ---------------
  Parameters:
    aslDefinitionsVersion:
      Type: String
      Default: "1"
      Description: ASL Definitions Version


  Resources:

    
    #  StateMachineNameDefinitionKey:
    #    Type: String
    #    Default: test.asl.json
    #    Description: State Machine Definition Key

  
    # ---------- QUEUE 🫡 ----------------
    genaiQueue: '${file(./iac/queues/genaiQueue.yml):genaiQueue}'
    genaiNotificationsQueue: '${file(./iac/queues/genaiQueue.yml):genaiNotificationsQueue}'

    # ---------- PIPES 🫡 ----------------
    genaiPipeRole: '${file(./iac/pipes/genaiPipe.yml):genaiPipeRole}'
    genaiPipe: '${file(./iac/pipes/genaiPipe.yml):genaiPipe}'

    # ---------- STATE MACHINE DEFINITION 🫡 ----------------
    statesLogGroup: '${file(./iac/states/genaistate.yml):statesLogGroup}'
    genaiState: '${file(./iac/states/genaistate.yml):genaiState}'
    statesRole: '${file(./iac/states/statesRole.yml):statesRole}'

    statesTestLogGroup: '${file(./iac/states/test.yml):statesTestLogGroup}'
    testState: '${file(./iac/states/test.yml):testState}'

    enrichStateLogGroup: '${file(./iac/states/enrichState.yml):enrichStateLogGroup}'
    enrichState: '${file(./iac/states/enrichState.yml):enrichState}'

    

    # ---------- WEBSOCKET API 🫡 ----------------
    WebSocketApi: '${file(./iac/api/websocket_api.yml):WebSocketApi}'
    WebSocketApiDeployment: '${file(./iac/api/websocket_api.yml):WebSocketApiDeployment}'
    WebSocketApiStage: '${file(./iac/api/websocket_api.yml):WebSocketApiStage}'
    WebSocketApiIntegrationRole: '${file(./iac/api/websocket_api.yml):WebSocketApiIntegrationRole}'
    DefaultRoute: '${file(./iac/api/websocket_api.yml):DefaultRoute}'
    DefaultRouteIntegration: '${file(./iac/api/websocket_api.yml):DefaultRouteIntegration}'
    DefaultRouteResponse: '${file(./iac/api/websocket_api.yml):DefaultRouteResponse}'
    DefaultRouteIntegrationResponse: '${file(./iac/api/websocket_api.yml):DefaultRouteIntegrationResponse}'
    ConnectRoute: '${file(./iac/api/websocket_api.yml):ConnectRoute}'



    # ---------- REST API 🫡 ----------------

    restApi: '${file(./iac/api/rest_api.yml):restApi}'
    #Stage: '${file(./iac/api/rest_api.yml):Stage}'
    #restApiDeploy: '${file(./iac/api/rest_api.yml):restApiDeploy}'
    restApiRole: '${file(./iac/api/rest_api.yml):restApiRole}'

    #privaterestApi: '${file(./iac/api/private_api.yml):privaterestApi}'
    #privaterestApiDeploy: '${file(./iac/api/private_api.yml):privaterestApiDeploy}'
    #privateStage: '${file(./iac/api/private_api.yml):privateStage}'
    #privaterestApiRole: '${file(./iac/api/private_api.yml):privaterestApiRole}'

    #RootMethod: '${file(./iac/api/private_api.yml):RootMethod}'

    ## ---------- RESOURCES - REST API 🫡 ----------------
    queueEventResource: '${file(./iac/api/definitions/queue_event.yml):queueEventResource}'
    queueEventMethodPost: '${file(./iac/api/definitions/queue_event.yml):queueEventMethodPost}'

    RequestBodyModel: '${file(./iac/api/definitions/queue_event.yml):RequestBodyModel}'
    POSTValidator: '${file(./iac/api/definitions/queue_event.yml):POSTValidator}'
    

    # ------------ CDN 🤨 ------------------
    genaiDistribution: '${file(./iac/cdn/cdn.yml):genaiDistribution}'
    #cdnVpc: '${file(./iac/cdn/cdnvpc.yml):cdnVpc}'
    #CloudFrontOAC: '${file(./iac/cdn/cdnvpc.yml):CloudFrontOAC}'

  

    # ---------- API KEYS 🫡 ----------------
    ApiKey: '${file(./iac/api/websocket_api.yml):ApiKey}'
    UsagePlanKey: '${file(./iac/api/websocket_api.yml):UsagePlanKey}'
    UsagePlan: '${file(./iac/api/websocket_api.yml):UsagePlan}'

    

    # ---------- DYNAMO 🫡 ---------------
    #privateModel: '${file(./iac/dynamo/privateModel.yml):privateModel}'
    sessionsBedrock: '${file(./iac/dynamo/sessionsBedrock.yml):sessionsBedrock}'

    #vectorDatabase: '${file(./iac/dynamo/vectors.yml):vectorDatabase}'

    # ---------- S3 TABLE 🫡 ---------------
    #s3Table: '${file(./iac/s3/tables.yml):s3Table}'
    #s3TableOutput: '${file(./iac/s3/tables.yml):s3TableOutput}'

    contentBucket: '${file(./iac/s3/content.yml):contentBucket}'

    # ---------- S3 WEBSITE 🫡 --------------
    #WebsiteBucket: '${file(./iac/s3/frontend.yml):WebsiteBucket}'
    #WebsiteBucketPolicy: '${file(./iac/s3/frontend.yml):WebsiteBucketPolicy}'

    # ---------- S3 VECTORS 🫡 ---------------
    #VectorIndicesBucket: '${file(./iac/s3/vectors.yml):VectorIndicesBucket}'

    # ---------- S3 ASL DEFINITIONS 🫡 --------------
    aslDefinitionsBucket: '${file(./iac/s3/asldefinitions.yml):aslDefinitionsBucket}'

    # ----------- TEXTRACTOR FUNCTIONS 🫡 --------------

    textExtractorFunction: '${file(./iac/lambda/textExtractor.yml):textExtractorFunction}'

    #   ------- Networking  🫡 --------------

    #privateApiVPCEndpoint: '${file(./iac/network/vpc-link.yml):privateApiVPCEndpoint}'
    #ENIsIP: '${file(./iac/network/vpc-link.yml):ENIsIP}'

    #privateLoadBalancer: '${file(./iac/network/nlb.yml):privateLoadBalancer}'
    #privateTargetGroup: '${file(./iac/network/nlb.yml):privateTargetGroup}'
    #privateNLBListener: '${file(./iac/network/nlb.yml):privateNLBListener}'

    #VpcLink: '${file(./iac/network/vpc-link.yml):VpcLink}'
    #ApiSecurityGroup: '${file(./iac/network/sg.yml):ApiSecurityGroup}'

    #privatenotificationResource: '${file(./iac/api/definitions/private_crud.yml):privatenotificationResource}'
    #privatenotificationOwnerResource: '${file(./iac/api/definitions/private_crud.yml):privatenotificationOwnerResource}'
    #privatenotificationOwnerPathResource: '${file(./iac/api/definitions/private_crud.yml):privatenotificationOwnerPathResource}'
    #privatenotificationOwnerMethodGet: '${file(./iac/api/definitions/private_crud.yml):privatenotificationOwnerMethodGet}'

    

